name: release

# 推一个 v* 标签就发一版：先跑质量门，再打包，然后建 Release 并挂 tarball；
# 仓库里配了 NPM_TOKEN secret 就顺带发 npm。
# 例：
#   npm version patch --no-git-tag-version   # 或手工改 package.json 的 version
#   git commit -am "chore: release v0.3.1"
#   git tag v0.3.1 && git push origin main --tags
#
# 版本号以 package.json 为准：标签与它不一致时任务直接失败，不发版。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（必须与 package.json 的 version 一致），例如 v0.3.0'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: build + pack + publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # job 级 env 里能安全读 secrets；步骤用 env 判断，避免 step if 直接引 secrets 的兼容性问题
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' && '1' || '' }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tarball: ${{ steps.meta.outputs.tarball }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # 发布前必须绿；不绿就不发版，避免把坏包挂到 Release 上
      - name: Verify
        run: npm run verify

      - name: Resolve version and check the tag matches
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          REF_TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            REF_TAG="${{ inputs.tag }}"
          fi
          echo "package.json version: ${VERSION}"
          echo "ref/tag: ${REF_TAG}"
          if [ "${REF_TAG}" != "v${VERSION}" ]; then
            echo "::error::标签 ${REF_TAG} 与 package.json 的 ${VERSION} 不一致（应为 v${VERSION}）"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tarball=dsh-context-domains-${VERSION}.tgz" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"

      # 稳定别名：资产名固定为 dsh-context-domains.tgz，
      # 这样插件市场的 tarball 字段可以写 releases/latest/download/dsh-context-domains.tgz，
      # 每次发版都不用改条目。
      - name: Prepare assets
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          cp "$RUNNER_TEMP/dsh-context-domains-${VERSION}.tgz" "$RUNNER_TEMP/dsh-context-domains.tgz"
          ls -la "$RUNNER_TEMP"/*.tgz
          sha256sum "$RUNNER_TEMP"/*.tgz | tee "$RUNNER_TEMP/SHA256SUMS.txt"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.meta.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，改为补充资产"
          else
            gh release create "$TAG" --title "dsh-context-domains ${{ steps.meta.outputs.version }}" --generate-notes
          fi
          gh release upload "$TAG" \
            "$RUNNER_TEMP/dsh-context-domains-${{ steps.meta.outputs.version }}.tgz" \
            "$RUNNER_TEMP/dsh-context-domains.tgz" \
            "$RUNNER_TEMP/SHA256SUMS.txt" \
            --clobber

      # 可选：仓库里配了 NPM_TOKEN secret 才发 npm；没配就跳过，不发红。
      # 幂等：这个版本已经在 registry 上就跳过，于是「发布成功但后面某步失败」之后
      # 直接 rerun 这一条 job 不会因为 EPUBLISHCONFLICT 再红一次。
      - name: Publish to npm (optional)
        if: ${{ env.HAS_NPM_TOKEN == '1' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          PKG="dsh-context-domains"
          VERSION="${{ steps.meta.outputs.version }}"
          if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PKG}@${VERSION} 已经在 npm 上，跳过发布"
          else
            npm publish --access public
          fi
          # 刚发上去的版本在 registry 元数据里有几十秒到几分钟的延迟，
          # 立刻 npm view 会 404，把一次成功的发布判成失败。轮询，超时只警告。
          for i in $(seq 1 12); do
            if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
              echo "registry 已能看到 ${PKG}@${VERSION}"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::npm publish 已返回成功，但 registry 元数据 3 分钟内还没刷新，稍后自行核对"

      # 收尾自检：市场条目指向的是稳定别名，它 404 了没人会发现。
      # 顺带把「删标签再重建把 Release 变成 untagged draft」这类事故变成红灯。
      - name: Verify the stable download URL
        run: |
          set -euo pipefail
          URL="${{ github.server_url }}/${{ github.repository }}/releases/latest/download/dsh-context-domains.tgz"
          for i in $(seq 1 10); do
            CODE="$(curl -sIL -o /dev/null -w '%{http_code}' "$URL" || true)"
            echo "try $i: $CODE $URL"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 6
          done
          echo "::error::稳定别名下载地址不是 200：$URL（Release 是不是变成 draft / 资产名改了？）"
          exit 1

      - name: Summary
        run: |
          {
            echo "### 发布完成"
            echo ""
            echo "- 版本：\`${{ steps.meta.outputs.version }}\`"
            echo "- 资产：\`${{ steps.meta.outputs.tarball }}\` + 稳定别名 \`dsh-context-domains.tgz\` + \`SHA256SUMS.txt\`"
            echo "- 安装（GitHub Release）："
            echo '  ```sh'
            echo "  dsh plugin --profile web add ${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ steps.meta.outputs.version }}/${{ steps.meta.outputs.tarball }}"
            echo '  ```'
            echo "- 安装（npm）："
            echo '  ```sh'
            echo "  dsh plugin --profile web add dsh-context-domains@${{ steps.meta.outputs.version }}"
            echo '  ```'
          } >> "$GITHUB_STEP_SUMMARY"
