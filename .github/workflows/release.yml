name: release

# 推一个 v* 标签就发一版：先跑质量门，再打包，然后建 Release 并挂 tarball；
# 仓库里配了 NPM_TOKEN secret 就顺带发 npm。
# 例：
#   npm version patch --no-git-tag-version   # 或手工改 package.json 的 version
#   git commit -am "chore: release v0.3.1"
#   git tag v0.3.1 && git push origin main --tags
#
# 版本号以 package.json 为准：标签与它不一致时任务直接失败，不发版。
#
# 发完之后还有一步：notify job 回调中台（context-domains.release），由 NAS 的 ops 把
# 「npm 有没有这一版」「插件市场条目跟不跟得上」这两面收齐。三面齐了才算一版上线。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签（必须与 package.json 的 version 一致），例如 v0.3.0'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: build + pack + publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # job 级 env 里能安全读 secrets；步骤用 env 判断，避免 step if 直接引 secrets 的兼容性问题
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' && '1' || '' }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tarball: ${{ steps.meta.outputs.tarball }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # 发布前必须绿；不绿就不发版，避免把坏包挂到 Release 上
      - name: Verify
        run: npm run verify

      - name: Resolve version and check the tag matches
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          REF_TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            REF_TAG="${{ inputs.tag }}"
          fi
          echo "package.json version: ${VERSION}"
          echo "ref/tag: ${REF_TAG}"
          if [ "${REF_TAG}" != "v${VERSION}" ]; then
            echo "::error::标签 ${REF_TAG} 与 package.json 的 ${VERSION} 不一致（应为 v${VERSION}）"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tarball=dsh-context-domains-${VERSION}.tgz" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"

      # 稳定别名：资产名固定为 dsh-context-domains.tgz，
      # 这样插件市场的 tarball 字段可以写 releases/latest/download/dsh-context-domains.tgz，
      # 每次发版都不用改条目。
      - name: Prepare assets
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          cp "$RUNNER_TEMP/dsh-context-domains-${VERSION}.tgz" "$RUNNER_TEMP/dsh-context-domains.tgz"
          ls -la "$RUNNER_TEMP"/*.tgz
          sha256sum "$RUNNER_TEMP"/*.tgz | tee "$RUNNER_TEMP/SHA256SUMS.txt"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.meta.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG 已存在，改为补充资产"
          else
            gh release create "$TAG" --title "dsh-context-domains ${{ steps.meta.outputs.version }}" --generate-notes
          fi
          gh release upload "$TAG" \
            "$RUNNER_TEMP/dsh-context-domains-${{ steps.meta.outputs.version }}.tgz" \
            "$RUNNER_TEMP/dsh-context-domains.tgz" \
            "$RUNNER_TEMP/SHA256SUMS.txt" \
            --clobber

      # 可选：仓库里配了 NPM_TOKEN secret 才发 npm；没配就跳过，不发红。
      # 幂等：这个版本已经在 registry 上就跳过，于是「发布成功但后面某步失败」之后
      # 直接 rerun 这一条 job 不会因为 EPUBLISHCONFLICT 再红一次。
      - name: Publish to npm (optional)
        if: ${{ env.HAS_NPM_TOKEN == '1' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          PKG="dsh-context-domains"
          VERSION="${{ steps.meta.outputs.version }}"
          if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PKG}@${VERSION} 已经在 npm 上，跳过发布"
          else
            npm publish --access public
          fi
          # 刚发上去的版本在 registry 元数据里有几十秒到几分钟的延迟，
          # 立刻 npm view 会 404，把一次成功的发布判成失败。轮询，超时只警告。
          for i in $(seq 1 12); do
            if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
              echo "registry 已能看到 ${PKG}@${VERSION}"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::npm publish 已返回成功，但 registry 元数据 3 分钟内还没刷新，稍后自行核对"

      # 收尾自检：市场条目指向的是稳定别名，它 404 了没人会发现。
      # 顺带把「删标签再重建把 Release 变成 untagged draft」这类事故变成红灯。
      - name: Verify the stable download URL
        run: |
          set -euo pipefail
          URL="${{ github.server_url }}/${{ github.repository }}/releases/latest/download/dsh-context-domains.tgz"
          for i in $(seq 1 10); do
            CODE="$(curl -sIL -o /dev/null -w '%{http_code}' "$URL" || true)"
            echo "try $i: $CODE $URL"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 6
          done
          echo "::error::稳定别名下载地址不是 200：$URL（Release 是不是变成 draft / 资产名改了？）"
          exit 1

      - name: Summary
        run: |
          {
            echo "### 发布完成"
            echo ""
            echo "- 版本：\`${{ steps.meta.outputs.version }}\`"
            echo "- 资产：\`${{ steps.meta.outputs.tarball }}\` + 稳定别名 \`dsh-context-domains.tgz\` + \`SHA256SUMS.txt\`"
            echo "- 安装（GitHub Release）："
            echo '  ```sh'
            echo "  dsh plugin --profile web add ${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ steps.meta.outputs.version }}/${{ steps.meta.outputs.tarball }}"
            echo '  ```'
            echo "- 安装（npm）："
            echo '  ```sh'
            echo "  dsh plugin --profile web add dsh-context-domains@${{ steps.meta.outputs.version }}"
            echo '  ```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 资产挂好、别名 200、npm 发完，这里只负责叫中台：POST context-domains.release 后等这一轮跑完。
  # 中台按规则「上下文领域：自动上线」把它交给 NAS 的 ops（xrznas/context-domains/release/run.sh），
  # 那一轮补齐剩下两面：npm 缺的补发、市场条目与这一版不一致就提 PR。
  #
  # 口径与 agent-autoloop 的 release.yml 一致（节点 212）：
  #   - subject 必须是 tag，不能是仓库名：ops.sh 把 subject 原样当 $1 传给 run.sh，含 / 会被判版本号不合法。
  #   - 幂等键只用 tag，不拼 run id：重跑同一次发版不该再走一遍。
  #   - 来源必须是 github：hook 只认 source github 那对密钥，写错就进 unrouted、静默不上线。
  #   - 发不出去要让 workflow 红：没有兜底轮询，这条事件就是唯一的发版信号。
  notify:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 发上线事件
        env:
          HUB: ${{ secrets.AUTOLOOP_HOOK_URL }}
          KEY: ${{ secrets.AUTOLOOP_SOURCE_KEY }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          SHA: ${{ github.sha }}
          UA: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36
        run: |
          set -euo pipefail
          [ -n "$HUB" ] || { echo "没有配 AUTOLOOP_HOOK_URL（bash hub/seed-secrets.sh guicaiyue/dsh-context-domains）"; exit 1; }
          [ -n "$KEY" ] || { echo "没有配 AUTOLOOP_SOURCE_KEY（bash hub/seed-secrets.sh guicaiyue/dsh-context-domains）"; exit 1; }
          id="context-domains.release:${REPO}:${TAG}"
          detail=$(jq -cn --arg repo "$REPO" --arg tag "$TAG" --arg sha "$SHA" \
            '{repo:$repo, tag:$tag, sha:$sha}')
          payload=$(jq -cn --arg id "$id" --arg type context-domains.release --arg subject "$TAG" \
            --arg summary "上下文领域新版本 $TAG（Release 资产已挂上）" --arg detail "$detail" \
            --arg link "https://github.com/${REPO}/releases/tag/${TAG}" \
            '{id:$id, type:$type, subject:$subject, summary:$summary, detail:$detail, link:$link}')
          # 雷池把 curl 的默认 UA 当机器人直接 403；带一个普通浏览器 UA 就放行。
          resp=$(curl -fsS -A "$UA" -X POST "$HUB/v1/events" \
            -H "Authorization: Bearer $KEY" -H 'content-type: application/json' -d "$payload")
          echo "$resp"
          if [ "$(echo "$resp" | jq -r .duplicate)" = "true" ]; then
            echo "这条事件之前已经记过（同样的 id），没有新的一轮，不用等。"
            exit 0
          fi
          echo "EVENT=$(echo "$resp" | jq -r .event)" >> "$GITHUB_ENV"
          echo "EVENT_ID=$id" >> "$GITHUB_ENV"

      - name: 等三面收齐
        env:
          HUB: ${{ secrets.AUTOLOOP_HOOK_URL }}
          KEY: ${{ secrets.AUTOLOOP_SOURCE_KEY }}
          WAIT: "900"
          UA: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36
        run: |
          set -uo pipefail
          [ -n "${EVENT:-}" ] || { echo "没有新事件（重复触发），不用等。"; exit 0; }
          rounds=$(( ${WAIT:-900} / 4 ))
          for i in $(seq 1 $rounds); do
            sleep 4
            body=$(curl -fsS -A "$UA" -H "Authorization: Bearer $KEY" "$HUB/v1/events/$EVENT" || true)
            [ -n "$body" ] || continue
            state=$(echo "$body" | jq -r '(.runs[0].state) // "none"')
            echo "第 $i 次：state=$state"
            case "$state" in
              done|nothing)
                summary=$(echo "$body" | jq -r '.runs[0].summary // ""')
                echo "$summary"
                # 三面没齐时 NAS 那一轮回的是「没上线：…」。它不是没跑成（不重试），
                # 但这一版确实还没上全，workflow 要红，否则只有一张卡片、一眼就划过去了。
                case "$summary" in
                  没上线*) echo "::error::三面没齐：$summary"; exit 1 ;;
                esac
                echo "这一轮做完了。"
                exit 0 ;;
              cancelled)
                echo "这一轮被取消了："; echo "$body" | jq -c '.runs[0]' | head -c 600; exit 1 ;;
            esac
          done
          echo "等了 $((WAIT/60)) 分钟还没结论，去中台看：$EVENT_ID" >&2
          exit 1
